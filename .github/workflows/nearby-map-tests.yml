name: Nearby Multi-Pin Map Tests
on:
  pull_request:
    paths:
      - 'public/app.js'
      - 'public/map-multipin.js'
      - 'vercel.json'
      - 'lib/handler.ts'
      - 'tests/nearby-map.test.mjs'
      - '.github/workflows/nearby-map-tests.yml'
  push:
    branches:
      - 'main'
      - 'feat/**'
      - 'fix/**'
jobs:
  test-map:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test multi-pin map integration and XSS-safe popups
        run: node --test tests/nearby-map.test.mjs
