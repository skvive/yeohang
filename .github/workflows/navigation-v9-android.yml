name: Navigation V9 Android APK / Map QA
on:
  push:
    branches: [chatgpt/navigation-v9-map-brand-20261102]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v9-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout V9 sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run navigation regression tests
        run: node --test tests/nearby-map.test.mjs tests/navigation-v9.test.mjs
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble V9 debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_V9_DEBUG_APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p android-app/artifacts
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n site.lexid.yeohangnav/.MainActivity
            sleep 22
            adb shell dumpsys activity activities | grep -E 'yeohangnav|mResumed' > android-app/artifacts/activity.txt || true
            adb shell pidof site.lexid.yeohangnav > android-app/artifacts/process.txt || true
            adb shell screencap -p /sdcard/yeohang_nav_v9.png
            adb pull /sdcard/yeohang_nav_v9.png android-app/artifacts/emulator-home.png
            adb logcat -d > android-app/artifacts/logcat.txt
            test -s android-app/artifacts/process.txt
            if grep -q 'NAV_MAP_SURFACE_READY' android-app/artifacts/logcat.txt; then
              echo "map_surface_rendered" > android-app/artifacts/web-gate.txt
              echo "Android WebView loaded the first-party map controls" >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eq 'NAV_PAGE_FAILED|NAV_HTTP_ERROR|NAV_TLS_ERROR' android-app/artifacts/logcat.txt; then
              echo "network_or_http_blocked" > android-app/artifacts/web-gate.txt
              echo "Android launched but the live site could not be resolved/reached in this emulator" >> "$GITHUB_STEP_SUMMARY"
              exit 22
            else
              echo "map_surface_unverified" > android-app/artifacts/web-gate.txt
              echo "Map DOM was not proven loaded; passing the installation alone is insufficient" >> "$GITHUB_STEP_SUMMARY"
              exit 23
            fi
      - name: Upload actual emulator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_V9_EMULATOR_EVIDENCE
          path: android-app/artifacts/
          if-no-files-found: ignore
          retention-days: 14
