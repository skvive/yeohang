name: Navigation V9 Android APK / Map QA
on:
  push:
    branches: [chatgpt/navigation-v9-map-brand-20261102]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v9-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout V9 sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run navigation regression tests
        run: node --test tests/nearby-map.test.mjs tests/navigation-v9.test.mjs
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reuse stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yeohang-kakao-debug-keystore-v1
      - name: Assemble V9 debug APK
        working-directory: android-app
        env:
          KAKAO_MOBILITY_APP_KEY: ${{ secrets.KAKAO_MOBILITY_APP_KEY }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Report debug signing key hash
        run: |
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android \
            | openssl dgst -sha1 -binary | openssl base64 -A
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_V9_DEBUG_APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p android-app/artifacts
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            timeout 90 bash -c 'until adb shell dumpsys connectivity | grep -q "VALIDATED"; do sleep 2; done'
            adb logcat -c
            adb shell am start -W -n site.lexid.yeohangnav/.MainActivity
            sleep 22
            adb shell dumpsys activity activities | grep -E 'yeohangnav|mResumed' > android-app/artifacts/activity.txt || true
            adb shell pidof site.lexid.yeohangnav > android-app/artifacts/process.txt || true
            adb shell screencap -p /sdcard/yeohang_nav_v9.png
            adb pull /sdcard/yeohang_nav_v9.png android-app/artifacts/emulator-home.png
            adb shell settings put secure location_mode 3
            adb shell pm grant site.lexid.yeohangnav android.permission.ACCESS_FINE_LOCATION
            adb emu geo fix 127.0276 37.4979
            gradle --no-daemon -p android-app :app:connectedDebugAndroidTest
            adb logcat -d > android-app/artifacts/logcat.txt
            test -s android-app/artifacts/process.txt
            bash android-app/verify-emulator-map.sh
      - name: Upload actual emulator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_V9_EMULATOR_EVIDENCE
          path: |
            android-app/artifacts/
            android-app/app/build/reports/androidTests/connected/
            android-app/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

