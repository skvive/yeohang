name: Android Emulator Lab - SDK and AVD Smoke

on:
  push:
    branches: [ci/android-lab-20261101]
    paths:
      - '.github/workflows/android-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-environment:
    name: Android SDK 36 + Gradle 8.13 + Emulator 35
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Check SDK and Gradle availability
        run: |
          set -euo pipefail
          java -version
          gradle --version | head -15
          command -v adb
          command -v sdkmanager
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0|emulator'
          test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"

      - name: Enable KVM acceleration on GitHub runner
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Boot actual Android 35 emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: yeohang-android-lab
          device: pixel_5
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-results/android-emulator
            adb devices -l | tee test-results/android-emulator/devices.txt
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
            adb shell getprop ro.build.version.release | tee test-results/android-emulator/os-version.txt
            adb shell getprop ro.build.version.sdk | tee test-results/android-emulator/api-level.txt
            adb shell wm size | tee test-results/android-emulator/display.txt
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb exec-out screencap -p > test-results/android-emulator/boot-screen.png
            test -s test-results/android-emulator/boot-screen.png
            if [ -f android-app/app/build/outputs/apk/mapsLink/debug/app-mapsLink-debug.apk ]; then
              adb install -r android-app/app/build/outputs/apk/mapsLink/debug/app-mapsLink-debug.apk
              adb shell am start -n site.lexid.yeohangnav/.MainActivity
              sleep 8
              adb exec-out screencap -p > test-results/android-emulator/yeohang-app.png
              adb logcat -d -s AndroidRuntime:E > test-results/android-emulator/app-crash.log
              if grep -q 'FATAL EXCEPTION' test-results/android-emulator/app-crash.log; then exit 1; fi
              echo 'APK installation and launch verified'
            else
              echo 'EMULATOR_OK; APP_NOT_PRESENT_IN_GITHUB_REPOSITORY' | tee test-results/android-emulator/status.txt
              echo 'To test v8 app, add android-app folder to this GitHub repository or provide a private artifact to this workflow.'
            fi

      - name: Upload nonsecret emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeohang-android-emulator-lab-evidence
          path: test-results/android-emulator/
          if-no-files-found: warn
          retention-days: 7
