name: Native Kakao Navigation Fullscreen Drawer QA
on:
  push:
    branches: [chatgpt/nav-fullscreen-drawer-20261108]
    paths:
      - 'android-app/**'
      - '.github/workflows/native-nav-fullscreen-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-nav:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify full-screen SDK map and sliding drawer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android-app/app/src/main/java/site/lexid/yeohangnav/KakaoNavigationActivity.kt').read_text()
          m=Path('android-app/app/src/main/AndroidManifest.xml').read_text()
          assert 'root.addView(mapView, android.widget.FrameLayout.LayoutParams(-1, -1))' in s
          assert 'tag = "nav-side-drawer"' in s
          assert 'menu!!.performClick()' in Path('android-app/app/src/androidTest/java/site/lexid/yeohangnav/KakaoNavigationSmokeTest.kt').read_text()
          assert m.count('android.intent.category.LAUNCHER') == 1
          assert m.index('android:name=".KakaoNavigationActivity"') < m.index('android.intent.category.LAUNCHER')
          assert 'ACCESS_BACKGROUND_LOCATION' not in m
          assert 'knsdk_ui:1.12.8-hotfix05' in Path('android-app/app/build.gradle').read_text()
          print('NAV_FULLSCREEN_SOURCE_GATES_PASS')
          PY
      - name: Compile Android app and instrumentation tests
        working-directory: android-app
        env:
          KAKAO_MOBILITY_APP_KEY: \${{ secrets.KAKAO_MOBILITY_APP_KEY }}
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_FULLSCREEN_DEBUG_APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 native navigation fullscreen and drawer smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p android-app/artifacts/fullscreen
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n site.lexid.yeohangnav/.KakaoNavigationActivity
            sleep 15
            adb exec-out screencap -p > android-app/artifacts/fullscreen/01-native-navigation-home.png
            adb shell input tap 90 170
            sleep 3
            adb exec-out screencap -p > android-app/artifacts/fullscreen/02-slide-out-drawer.png
            adb shell pidof site.lexid.yeohangnav > android-app/artifacts/fullscreen/process.txt
            adb logcat -d > android-app/artifacts/fullscreen/logcat.txt
            gradle --no-daemon -p android-app :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=site.lexid.yeohangnav.KakaoNavigationSmokeTest#defaultScreenFillsWithKakaoMapAndOpensDrawer
      - name: Publish screenshot and test evidence (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YEOHAENG_NAV_FULLSCREEN_DRAWER_EMULATOR_EVIDENCE
          path: |
            android-app/artifacts/fullscreen/
            android-app/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
