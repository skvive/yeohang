plugins {
    id 'com.android.application'
}
android {
    namespace 'site.lexid.yeohangnav'
    compileSdk 35
    defaultConfig {
        applicationId 'site.lexid.yeohangnav'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '9.0-map-brand-preview'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
