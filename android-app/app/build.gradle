plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def kakaoMobilityAppKey = localProperties.getProperty('kakaoMobilityAppKey',
    System.getenv('KAKAO_MOBILITY_APP_KEY') ?: '')

android {
    namespace 'site.lexid.yeohangnav'
    compileSdk 35
    defaultConfig {
        applicationId 'site.lexid.yeohangnav'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '10.0-kakao-navigation-preview'
        buildConfigField 'String', 'KAKAO_MOBILITY_APP_KEY', '\"' + kakaoMobilityAppKey + '\"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.kakaomobility.knsdk:knsdk_ui:1.12.8-hotfix05'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Embed the first-party V9 UI overlay into the APK. The production site may still
// serve V8 until the website branch is approved and deployed.
tasks.register('syncNavigationAssets', Copy) {
    from("${rootProject.projectDir}/../public") {
        include 'navigation-v9.js'
        include 'navigation-v9.css'
        include 'assets/mascot-jido.webp'
        include 'assets/mascot-gilbyeoli.webp'
    }
    into("${projectDir}/src/main/assets")
}
tasks.named('preBuild').configure { dependsOn tasks.named('syncNavigationAssets') }

tasks.register('syncNavigationIcon', Copy) {
    from("${rootProject.projectDir}/../public/assets/icon-192.png")
    into("${projectDir}/src/main/res/drawable")
    rename { 'yeohang_icon.png' }
}
tasks.named('preBuild').configure { dependsOn tasks.named('syncNavigationIcon') }
